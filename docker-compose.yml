services:
  openreader:
    # Use :latest for automatic upgrades, or replace it with :<commit> for a pinned release.
    image: ghcr.io/changshengyu/openreader:latest
    # Always refresh the selected tag before the container is recreated.
    pull_policy: always
    container_name: openreader
    ports:
      # Change only the host-side port (left) when 8080 is already in use.
      - "8080:8080"
    volumes:
      # Change only the host-side paths (left). Keep the container paths unchanged.
      - ./data:/app/data
      - ./cache:/app/cache
      - ./library:/app/library
    environment:
      # Leave empty for direct access. Behind a reverse proxy, set only the proxy IP/CIDR.
      OPENREADER_TRUSTED_PROXIES: ${OPENREADER_TRUSTED_PROXIES:-}
      # Optional: require this invite code (邀请码) for registration. Empty keeps it open.
      OPENREADER_INVITE_CODE: ${OPENREADER_INVITE_CODE:-}
      # Optional: maximum number of accounts, 1-50. Empty uses the default 50.
      OPENREADER_USER_LIMIT: ${OPENREADER_USER_LIMIT:-}
    # Restart after host/container-engine restarts unless explicitly stopped.
    restart: unless-stopped
