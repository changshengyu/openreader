name: Build and publish Docker image

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/docker-publish.yml
      - .dockerignore
      - Dockerfile
      - docker-compose.yml
      - backend/**
      - frontend/**
      - scripts/docker-volume-backup-smoke.sh
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-main
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  publish:
    name: Validate and publish multi-platform image
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Prepare image metadata
        id: metadata
        shell: bash
        run: |
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Test backend
        working-directory: backend
        run: go test ./...

      - name: Generate vendored Go build context
        working-directory: backend
        run: go mod vendor -o "${RUNNER_TEMP}/openreader-go-vendor"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build native validation image
        uses: docker/build-push-action@v7
        with:
          context: .
          build-contexts: |
            go_vendor=${{ runner.temp }}/openreader-go-vendor
          platforms: linux/amd64
          load: true
          push: false
          tags: openreader-ci:${{ github.sha }}
          build-args: |
            VERSION=${{ steps.metadata.outputs.short_sha }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.metadata.outputs.build_date }}
          cache-from: type=gha,scope=openreader-docker
          cache-to: type=gha,mode=max,scope=openreader-docker

      - name: Validate fresh volumes and portable backups
        env:
          IMAGE: openreader-ci:${{ github.sha }}
        run: ./scripts/docker-volume-backup-smoke.sh

      - name: Validate historical volume compatibility
        env:
          HISTORICAL_VOLUME: "1"
          IMAGE: openreader-ci:${{ github.sha }}
        run: ./scripts/docker-volume-backup-smoke.sh

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish multi-platform image
        id: publish
        uses: docker/build-push-action@v7
        with:
          context: .
          build-contexts: |
            go_vendor=${{ runner.temp }}/openreader-go-vendor
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.metadata.outputs.short_sha }}
          build-args: |
            VERSION=${{ steps.metadata.outputs.short_sha }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.metadata.outputs.build_date }}
          cache-from: type=gha,scope=openreader-docker
          cache-to: type=gha,mode=max,scope=openreader-docker

      - name: Verify published platforms
        shell: bash
        run: |
          docker buildx imagetools inspect "${IMAGE_NAME}@${{ steps.publish.outputs.digest }}" | tee /tmp/openreader-image-index.txt
          grep -q 'linux/amd64' /tmp/openreader-image-index.txt
          grep -q 'linux/arm64' /tmp/openreader-image-index.txt
          {
            echo "### Published image"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Tags: \`${IMAGE_NAME}:latest\`, \`${IMAGE_NAME}:${{ steps.metadata.outputs.short_sha }}\`"
            echo "- Digest: \`${{ steps.publish.outputs.digest }}\`"
            echo "- Platforms: \`linux/amd64\`, \`linux/arm64\`"
          } >> "$GITHUB_STEP_SUMMARY"
